[package]
name = "gafcoreai"
version = "1.0.0"
description = "GafCoreAI - IDE con agentes de IA"
authors = ["GafCoreAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "gafcoreai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
portable-pty = "0.8"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
